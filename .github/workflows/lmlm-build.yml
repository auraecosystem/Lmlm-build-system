name: LMLM Build Fabric
on:
  push:
    paths:
      - "lmlm-build/**"
      - ".github/workflows/lmlm-build.yml"
  pull_request:
    paths:
      - "lmlm-build/**"
      - ".github/workflows/lmlm-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: ./lmlm-build/scripts/lmlm-build.sh configure --profile cpu
      - name: Build and test
        run: |
          ./lmlm-build/scripts/lmlm-build.sh test --profile cpu
          ./lmlm-build/tests/test_cli.sh
      - name: Package
        run: ./lmlm-build/scripts/lmlm-build.sh package --profile cpu
      - uses: actions/upload-artifact@v4
        with:
          name: lmlm-build-fabric-cpu
          path: lmlm-build/artifacts/install/
